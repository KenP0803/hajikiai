<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじきあい 2.3.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+JP:wght@500;700&display=swap');

:root{
  --bg:#171412; --panel:#221d19; --line:#3a322b;
  --text:#f0e7dd; --dim:#9b8b7c; --gold:#f7b733;
  --mine:#6ec4e0; --foe:#e0725d;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; overscroll-behavior:none }
body{
  margin:0; height:100dvh;
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  font-weight:500; display:flex; justify-content:center; overflow:hidden;
  /* iOS：ダブルタップ拡大・文字選択・長押しメニューを止める。
     ただし盤面以外では指の操作を殺しきらない（拡大から戻れなくなるため） */
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#wrap{
  width:100%; max-width:440px; height:100%;
  display:flex; flex-direction:column; gap:6px;
  padding:max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
}
.num{ font-family:"Bungee","Noto Sans JP",sans-serif; font-variant-numeric:tabular-nums }

/* ===== チームの残りライフ ===== */
.life{
  display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:11px; padding:6px 11px;
}
.life .lb{ font-size:11px; color:var(--dim); flex:0 0 auto }
.life .pips{ display:flex; gap:3px; flex:1; flex-wrap:wrap }
.life .pip{ width:9px; height:9px; border-radius:3px; background:#0e0c0a }
.life.foe .pip.on{ background:var(--foe) }
.life.me  .pip.on{ background:var(--mine) }
.life .n{ font-size:16px; flex:0 0 auto }

/* ===== 3体ぶんのチップ ===== */
.team{ display:flex; gap:6px }
.chip{
  flex:1; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; padding:4px 6px; transition:.15s; text-align:center;
}
.chip.now{ border-color:var(--gold); background:#2b2418 }
.chip.down{ opacity:.32 }
.chip.empty{ border-style:dashed; opacity:.45 }
.chip .f{ font-size:16px; line-height:1.2 }
.chip .s{ font-size:9.5px; color:var(--dim); margin-top:1px }
.chip .s b{ color:var(--text) }
.chip .cost{ font-size:9px; color:var(--gold) }

#stage{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative;
        touch-action:none }   /* 弾く操作を邪魔されないよう、盤面だけは指の動きを全部もらう */
canvas{ display:block; border-radius:12px; border:1px solid var(--line); background:#0f0d0b }

#info{
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:8px 12px; text-align:center;
}
#info .who{ font-size:13.5px; font-weight:700 }
#info .sk{ font-size:11px; color:var(--dim); margin-top:2px }
#info .sk b{ color:var(--gold) }

/* ===== 編成画面 ===== */
#pick{
  position:absolute; inset:0; display:none; flex-direction:column; gap:7px;
  background:#14110f; border-radius:12px; padding:10px; overflow-y:auto;
}
#pick.show{ display:flex }
#pick h3{ font-size:14px; margin:0; text-align:center; flex:0 0 auto }
#pick h3 span{ color:var(--gold) }
/* 画面が低い時は、一覧を潰すのではなく編成の面ごとスクロールさせる。
   潰れた一覧は「無い」のと同じだった */
#pickList{
  display:grid; grid-template-columns:1fr 1fr; gap:6px;
  flex:0 0 auto; align-content:start;
}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:6px 5px; text-align:center; cursor:pointer; transition:.12s;
}
.card.on{ border-color:var(--gold); background:#2b2418 }
.card .f{ font-size:22px; line-height:1.1 }
.card .n{ font-size:11px; font-weight:700 }
.card .sk{ font-size:10px; color:var(--gold) }
.card .st{ font-size:9.5px; color:var(--dim); margin-top:1px }
/* 「はじめる」は常に見えていること。スクロールしないと見えないボタンは押されない */
#pickFoot{
  display:flex; gap:8px; align-items:center; flex:0 0 auto;
  position:sticky; bottom:-10px; background:#14110f; padding:6px 0 0;
}
#start{
  flex:1; padding:14px; border:none; border-radius:12px;
  background:var(--gold); color:#231a08; font-size:15px; font-weight:700;
  font-family:inherit; cursor:pointer;
}
#start:disabled{ background:var(--panel); color:#6b5f53; border:1px solid var(--line) }
#pickNote{ font-size:10.5px; color:var(--dim); text-align:center; line-height:1.5; flex:0 0 auto }
#pickNote b{ color:var(--text) }
#reteam{
  margin-top:10px; padding:11px 22px; border:1px solid var(--line); border-radius:12px;
  background:var(--panel); color:var(--text); font-size:13px;
  font-family:inherit; cursor:pointer;
}

/* ===== あそんだ記録 ===== */
/* 横画面では遊べない作りなので、正直にそう出す。
   iOS は向きを固定できないため、これが確実な手 */
#rotate{
  position:fixed; inset:0; z-index:20; display:none;
  place-items:center; text-align:center; padding:24px;
  background:var(--bg); color:var(--text);
}
#rotate .ic{ font-size:44px; line-height:1.4 }
#rotate .t{ font-size:17px; font-weight:700; margin-top:6px }
#rotate .d{ font-size:12px; color:var(--dim); margin-top:6px; line-height:1.6 }
@media (orientation: landscape) and (max-height: 520px){
  #rotate{ display:grid }
  #wrap{ visibility:hidden }
}

/* ===== 画面の切り替え ===== */
#nav{ display:flex; align-items:center; gap:6px; flex:0 0 auto }
#navPrev, #navNext{
  flex:0 0 auto; width:38px; height:38px; border:1px solid var(--line);
  border-radius:11px; background:var(--panel); color:var(--text);
  font-size:15px; font-family:inherit; cursor:pointer; line-height:1;
}
#navMid{ flex:1; text-align:center; min-width:0 }
#navName{ font-size:13.5px; font-weight:700; letter-spacing:.04em }
#navDots{ display:flex; gap:5px; justify-content:center; margin-top:3px }
#navDots span{ width:6px; height:6px; border-radius:50%; background:var(--line) }
#navDots span.on{ background:var(--gold) }
/* 画面はここで入れ替える。盤面のある画面だけが伸び縮みする */
.scr{ display:none; flex:1 1 auto; min-height:0; flex-direction:column; gap:6px }
.scr.on{ display:flex }
#scrData, #scrSet{ overflow-y:auto; padding-top:4px }

/* ===== あそんだ きろく ===== */
#dataHead{ font-size:11px; color:var(--dim); text-align:center; line-height:1.6; flex:0 0 auto }
#dataHead b{ color:var(--text) }
#dataNote{ font-size:10px; color:#6b5f53; text-align:center; line-height:1.5; padding-bottom:4px }
/* 3つの塊に分ける。何をまとめて何を分けたかが、見出しで分かるように */
.dcap{ font-size:10.5px; font-weight:700; color:var(--gold); padding:10px 2px 3px }
.dcap:first-child{ padding-top:2px }
table.dt{ width:100%; border-collapse:collapse; font-size:10.5px; table-layout:fixed }
table.dt th{ color:var(--dim); font-weight:500; font-size:9.5px; padding:3px 1px; border-bottom:1px solid var(--line) }
table.dt td{ padding:5px 1px; border-bottom:1px solid #241f1b; text-align:center;
             font-variant-numeric:tabular-nums }
table.dt td.nm{ text-align:left; white-space:nowrap }
table.dt td.big{ color:var(--gold); font-weight:700 }
table.dt tr.none td{ color:#574e45 }
/* 記録は選んで写せるようにする。画面ごと送ってもらうため */
#scrData, #scrData *{ -webkit-user-select:text; user-select:text }

/* ===== せってい ===== */
.set{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:11px; padding:11px 13px; flex:0 0 auto;
}
.set .t{ font-size:12.5px; font-weight:700 }
.set .d{ font-size:10px; color:var(--dim); line-height:1.5 }
.sw{
  flex:0 0 auto; width:44px; height:25px; border-radius:13px;
  background:#3a322b; border:0; position:relative; cursor:pointer;
}
.sw::after{
  content:''; position:absolute; top:3px; left:3px; width:19px; height:19px;
  border-radius:50%; background:var(--dim); transition:.15s;
}
.sw.on{ background:var(--foe) }
.sw.on::after{ left:22px; background:#fff }
.mini{
  flex:0 0 auto; padding:8px 15px; border:1px solid var(--line); border-radius:9px;
  background:var(--bg); color:var(--text); font-size:11.5px; font-family:inherit; cursor:pointer;
}
.mini.danger{ color:#6b5f53 }
#setVer{ font-size:10px; color:#4c443c; text-align:center; padding:4px 0 8px }

/* ===== きろくの もちだし ===== */
#saveState{ font-size:10px; line-height:1.6; text-align:center; padding:6px 2px; color:var(--dim) }
#saveState b{ color:var(--gold) }
#saveState.warn b{ color:var(--foe) }
#ioRow{ display:flex; gap:8px; justify-content:center; padding-bottom:6px }
/* 書き出しは「入力欄」にしない。
   iOS は文字16px未満の入力欄をタップすると勝手に拡大し、
   このゲームはピンチ操作を封じているので、戻せなくなる */
#ioCode{
  display:none; width:100%; background:var(--ink); color:var(--text);
  border:1px solid var(--line); border-radius:9px; padding:8px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12px; line-height:1.7;
  white-space:pre-wrap; word-break:break-all;
  -webkit-user-select:text; user-select:text;
}
#ioCode.show{ display:block }
#ioText{
  display:none; width:100%; background:var(--ink); color:var(--text);
  border:1px solid var(--line); border-radius:9px; padding:8px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:16px;      /* ★16px未満にしないこと。iOS が勝手に拡大する */
  line-height:1.5; resize:none; -webkit-user-select:text; user-select:text;
}
#ioText.show{ display:block }
#ioMsg{ font-size:10.5px; color:var(--gold); text-align:center; padding:5px 0; min-height:6px }
#ioAdd{ display:none; width:100%; margin-bottom:8px }
#ioAdd.show{ display:block }

#over{
  position:absolute; inset:0; display:none; place-items:center; text-align:center;
  background:rgba(15,13,11,.9); border-radius:12px; padding:20px;
}
#over.show{ display:grid }
#over h2{ font-size:26px; margin:0 0 6px }
#over p{ font-size:13px; color:var(--dim); margin:0 0 18px; line-height:1.7 }
#retry{
  padding:15px 34px; border:none; border-radius:13px;
  background:var(--gold); color:#231a08; font-size:15px; font-weight:700;
  font-family:inherit; cursor:pointer;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="nav">
    <button id="navPrev" aria-label="ひとつ前の画面">◀</button>
    <div id="navMid"><div id="navName">たいせん</div><div id="navDots"></div></div>
    <button id="navNext" aria-label="つぎの画面">▶</button>
  </div>

  <section id="scrPlay" class="scr on">
  <div class="life foe"><span class="lb">あいて</span><span class="pips" id="foePips"></span><span class="num n" id="foeN">0</span></div>
  <div class="team" id="foeTeam"></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="pick">
      <h3>つれていく <span>3たい</span> をえらぶ</h3>
      <div id="pickList"></div>
      <div id="pickNote">あいては 🐲リュウ・👹オニ・🦂サソリ</div>
      <div id="pickFoot"><button id="start" disabled>はじめる</button></div>
    </div>

    <div id="over">
      <div>
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <button id="retry">もう一度</button>
        <br><button id="reteam">へんせいを かえる</button>
      </div>
    </div>
  </div>

  <div class="team" id="myTeam"></div>
  <div class="life me"><span class="lb">じぶん</span><span class="pips" id="myPips"></span><span class="num n" id="myN">0</span></div>
  <div id="info"><div class="who" id="who"></div><div class="sk" id="sk"></div></div>
  </section>

  <section id="scrData" class="scr">
    <div id="dataHead"></div>
    <div id="dataTable"></div>
    <div id="dataNote"></div>
    <div id="saveState"></div>
    <div id="ioRow">
      <button class="mini" id="ioOut">かきだす</button>
      <button class="mini" id="ioIn">よみこむ</button>
    </div>
    <div id="ioCode"></div>
    <textarea id="ioText" rows="5" spellcheck="false" autocapitalize="off"
              autocorrect="off" placeholder="ここに はりつける"></textarea>
    <div id="ioMsg"></div>
    <button class="mini" id="ioAdd">この きろくを たす</button>
  </section>

  <section id="scrSet" class="scr">
    <div class="set">
      <div><div class="t">むずかしいモード</div>
        <div class="d" id="hardDesc"></div></div>
      <button class="sw" id="hardSw" aria-label="むずかしいモード"></button>
    </div>
    <div class="set">
      <div><div class="t">あそびかたを もう一度</div>
        <div class="d">さいしょの あんないを 出しなおす</div></div>
      <button class="mini" id="guideBtn">出す</button>
    </div>
    <div class="set">
      <div><div class="t">きろくを けす</div>
        <div class="d">せんせき・あそんだ きろくが 全部 消える</div></div>
      <button class="mini danger" id="wipeBtn">けす</button>
    </div>
    <div id="setVer"></div>
  </section>
</div>


<div id="rotate"><div>
  <div class="ic">📱</div>
  <div class="t">たてに してください</div>
  <div class="d">この あそびは たて画面 むけに つくってあります</div>
</div></div>

<script>
'use strict';

/* ============================================================
   はじきあい —— 1枚で動くターン制のはじき合い

   ■ 中身の順番（/* ===== ○○ ===== *​/ で探せる）
     調整用の数値 BAL … 手触りを変えたい時はここだけ触る
     スキル SKILLS      … 名前と説明。POOL の skill と対
     コマ POOL          … 7体の性能。id を足せばコマが増える
     状態               … 試合中に動く変数
     遊んだ記録         … バランス調整用に数える。何を分けて何をまとめるかの説明つき
     セーブ             … serialize / applySaved だけが保存の形を知っている
     入力 / 物理 / ターン / 描画 / UI
     画面の切り替え     … たいせん・きろく・せってい
     せってい / ループ / 編成画面 / きろくの もちだし

   ■ 守っている決まり
     ・保存は「減る方向に上書きしない」。空の画面が記録を消すのを防ぐ
     ・解放は足すだけ、引かない。コマを足しても前からの人に出てくる
     ・失敗を黙って握りつぶさない。できない事は画面に出す
     ・見えない・押せない・触れないものは、無いのと同じ
     ・同じことを2か所で数えない（戦績は mstat から計算する）

   ■ 変えたら必ず `node check.js` を通してから公開する
   ============================================================ */

const AW = 360, AH = 540;

/* ===== 調整用の数値。手触りが気に入らない時はここだけ触る ===== */
const BAL = {
  r:26,
  power:1000, pullMax:105, pullMin:14,
  friction:0.62,
  wallBounce:0.95, ballBounce:0.94,
  stopAt:34,
  /* --- スキルは尖らせる。平均化すると、どれを選んでも同じになってしまう --- */
  rehit:0.2,           // 同じ相手に続けて当たるまでの待ち時間（秒）
  chainStep:2, chainSpeed:1.22, chainRehit:0.2, chainTime:4, chainFric:0.80, chainKeep:0.55,
  /* 連撃：オニの「壁で加速」に対する「敵で加速」。当てるたび速くなり、
     その間は摩擦が弱くて転がり続ける。加えて威力も段々伸びる。
     速度だけ上げても命中は増えなかった——止まらないことの方が効く */
  heavyPush:2.0, heavyKeep:0.05,
  /* 重撃：自分は止まり、相手を大きく吹き飛ばす。
     1ターンに1回しか当たらないのが弱さだったので、攻撃力そのものを 2→4 にした。
     「壁に叩きつけたら2発目」も試したが、2つ重ねると最強格になったので外した */
  magnetPull:900, magnetTime:3.0, magnetBonus:0,   // 磁力：吸い付いて離れない
  pierceSlow:1.0,      // 貫通：減速せず貫き通す
  accelWall:1.22, accelMax:1900, accelTime:4, accelFric:0.80, accelKeep:0.55,
  /* 加速：壁で速くなり、その間は転がり続ける。
     効果時間だけ伸ばしても、摩擦で失速して壁に2回も当たれなかったため */
  maxFlyT:12,          // 保険。どんなスキルでもこの秒数で必ず止める
  ricoKeep:1.0,        // 跳弾：勢いを落とさず次々に跳ぶ
  blastR:120, blastDmg:5, blastStep:2, blastMax:11,
  /* 衝撃波：不発だった回数ぶん威力が溜まる（5→7→9→11で頭打ち）。
     当てた瞬間に全部放出して、5に戻る。
     伸びしろが無いのが弱さの正体だった。外した回が次に効く形にした */
  /* 衝撃波：自分の番が終わるたび、フグを中心にこの半径の中の相手全員へ。
     弾いたコマでなくても効く＝「当てる」技ではなく「良い場所に置く」技。
     毎ターン効くので、1回あたりの威力は他より軽い */
  extraDmg:1, extraMax:6,   // 追加攻撃：命中回数ぶん飛ぶ。多すぎると見えないので上限つき
  spikeDmg:3, spikeR:17,
  spikeEvery:3, spikeAddMin:1, spikeAddMax:2, spikeMax:6,
  /* 棘：3ターンごとに1〜2個ずつ湧く。最初は無い——案内の箱と重なって盤面が読めないため。
     上限を付けないと、長い試合で盤が棘だらけになる */
  myLife:21, foeLife:21,    // チームの残りライフ。左右対称。落とされるとコマのコストぶん減る
  aiNoise:22,          // 相手の狙いのブレ（度）
  aiMiss:0.56,         // 相手がまったく見当違いへ撃つ確率。ふつうの難易度はここで決まる
  hardFoeLife:10       // むずかしいモードで相手のチームライフに足す量。
                       /* 相手の狙いを良くする方式は失敗した。上手いAIは自分のコマを
                          自陣に固めてしまい、かえって当てやすくなったため */
};

/* ===== スキル。そのコマを弾く時に自動で乗る ===== */
const SKILLS = {
  chain:  { name:'連撃', desc:'敵に当たるたび速くなる。威力も伸びる' },
  heavy:  { name:'重撃', desc:'その場で止まり、相手を大きく吹き飛ばす。1発が重い' },
  magnet: { name:'磁力', desc:'吸い付いて何度も当たる。1発は軽い' },
  pierce: { name:'貫通', desc:'減速せず貫く。1発がとても重い' },
  accel:  { name:'加速', desc:'壁に当たるたび速くなる。しばらく止まらない' },
  ricochet:{ name:'跳弾', desc:'勢いを落とさず次々に跳ぶ' },
  blast:  { name:'衝撃波', desc:'自分の番の終わりに毎回爆発。外すほど 次が重い' }
};

/* コマの性能。6体の共通プールから3体を選ぶ。
   コストは今は一律。編成できるようにした結果、コストの差が
   「ライフの減る速さ」を2倍変えてしまい、選択がコストだけの勝負になったため。
   コマが増えたら「編成できる合計の上限」として復活させる予定 */
const POOL = [
  { id:'fox',  face:'🦊', name:'キツネ',   skill:'magnet', hp:10, atk:2, cost:2, shotCol:'#8fd7ff' },
  { id:'wolf', face:'🐺', name:'オオカミ', skill:'chain',  hp:10, atk:2, cost:2, shotCol:'#ffe08a' },
  { id:'bear', face:'🐻', name:'クマ',     skill:'heavy',  hp:13, atk:4, cost:2, shotCol:'#ffab6b' },
  { id:'drgn', face:'🐲', name:'リュウ',   skill:'pierce', hp:7,  atk:5, cost:2, shotCol:'#c9a6ff' },
  { id:'oni',  face:'👹', name:'オニ',     skill:'accel',  hp:13, atk:3, cost:2, shotCol:'#ff9b8a' },
  { id:'scrp', face:'🦂', name:'サソリ',   skill:'ricochet', hp:13, atk:3, cost:2, shotCol:'#9fe8b0' },
  { id:'puff', face:'🐡', name:'フグ',     skill:'blast',  hp:13, atk:1, cost:2, shotCol:'#ffd166' }
];

/* 使えるコマ。あとで「解放していく」形にする時は、ここを絞るだけでいい。
   ★解放を作る時の決まり：
     解放済みは「IDのリスト」として保存し、**足すだけ。引かない。**
       新しいリスト ＝ 保存されていたリスト ＋ 今の条件で解放されるもの
     「勝利数から毎回計算し直す」をやると、解放の順番を変えた時に
     すでに持っていたコマが消える。 */
/* いま「最初から使える」コマ。解放システムを入れる時は、ここを絞る */
const FREE = POOL.map(p => p.id);
let unlocked = FREE.slice();
let myPick = ['fox','wolf','bear'];      // いま選んでいる3体
/* 相手は固定チーム。プレイヤーの選択で相手も変わると、
   「自分の損が減る」と「相手の損が増える」が同時に起きて選択が壊れる */
const FOE_TEAM = ['drgn','oni','scrp'];
let roster = { me:[], foe:[] };

/* ===== 状態 ===== */
let pieces, spikes, turnTeam, ptr, phase, over, aim, fx, hitsThisTurn, active, flyT, life;
/* 戦績は mstat から計算する。二重に持たない——
   同じことを2か所で数えていると、片方だけ直し忘れて食い違う */
const wins   = () => mstat.n.w + mstat.h.w;
const losses = () => (mstat.n.n - mstat.n.w) + (mstat.h.n - mstat.h.w);
/* ===== 遊んだ記録（バランス調整用） =====
   端末の中だけに貯まる。画面に出して見せる以外、どこにも送らない。
   ボットで測ると「狙いが絡むスキル」を読み違えるため、人が遊んだ数字が要る */
/* 何を分けて、何をまとめるか。ここを間違えると集めた数字が使えなくなる。
     勝率・残りライフ …… モード別。相手のライフが違うので混ぜられない
     使用率・平均ダメージ … まとめてよい。モードで変わらない性質だから
   勝率は「難易度が合っているか」を見る数字であって、
   「どのコマが強いか」を見る数字ではない。手柄が3体のどれのものか分からないうえ、
   1試合で1つしか増えないので、必要な試合数が桁違いに多くなる */
let stats = {};    // コマのid -> { t はじいた, d ダメージ, z 空振り, ko 倒した, dd やられた, p 編成に入れた }
let comps = {};    // 'n|bear+fox+wolf' -> { n 試合, w 勝ち, mw 勝った時の自分の残りライフ合計 }
const newMode = () => ({ n:0, w:0, tn:0, mw:0, ml:0 });
let mstat = { n:newMode(), h:newMode(), since:0 };   // n=ふつう h=むずかしい
const st = id => (stats[id] = stats[id] || { t:0, d:0, z:0, ko:0, dd:0, p:0 });
const cmpKey = () => (hardOn ? 'h|' : 'n|') + myPick.slice().sort().join('+');
const cmp = k => (comps[k] = comps[k] || { n:0, w:0, mw:0 });
const allN = () => mstat.n.n + mstat.h.n;
let turnStartD = 0;   // このターンの開始時点で、弾いたコマが与えていた合計
/* 「うまくやった」と思わせるための表示。
   当てた瞬間だけでなく、ターン全体の成果を見せるのが効く */
let comboT = 9, dmgThisTurn = 0, shake = 0;
let picking = false;      // 編成画面を開いているか
let hardOn = false;       // むずかしいモード：相手のライフが増える
/* 相手のライフの上限。参照はここに集約する */
const foeLifeMax = () => BAL.foeLife + (hardOn ? BAL.hardFoeLife : 0);
let guide = true;         // 勝ち方の案内。最初の一投で消える
/* 棘は最初から出さない。案内の箱と重なって盤面が読みにくいため。
   ターンを数えて、3ターンごとに少しずつ湧かせる */
let turnCount = 0;

/* ===== セーブ =====
   ブラウザの中だけに残る。数値やルールを変えた時に古い途中データで壊れないよう、
   版番号が違うセーブは読み捨てる（編成と解放と戦績は拾えるだけ拾う） */
const SAVE_KEY = 'hajikiai';
/* 保存できるかを実際に書いて読んで確かめる。
   ここで失敗を黙って握りつぶしていたせいで、記録が消えていることに
   ずっと気づけなかった。**失敗は必ず画面に出す** */
let saveOK = false;
/* 別サイトの枠の中（Artifact）か、自分のページとして開いているか。
   枠の中だと、ブラウザによっては閉じた時に保存が捨てられる */
const inFrame = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
try {
  localStorage.setItem(SAVE_KEY + '_t', '1');
  saveOK = localStorage.getItem(SAVE_KEY + '_t') === '1';
  localStorage.removeItem(SAVE_KEY + '_t');
} catch (e) { saveOK = false; }
/* 版番号は「途中の試合の形式」にだけ効く。
   解放・戦績・編成は、版が違っても絶対に捨てない。
   でないと数値をいじるたびに解放がやり直しになってしまう */
const SAVE_VER = 2;

/* ★保存する形を知っているのは、この2つだけ。
   あちこちで組み立てていると、項目を足した時に片方だけ直し忘れる */
function serialize(){
  const d = { v:SAVE_VER, pick:myPick, unlocked, hardOn, stats, mstat, comps };
  // 途中の試合も残す。ただし「編成中でなく、玉が止まっていて操作待ち」の時だけ。
  // 編成中も保存すると、リロード時に始めていない試合が再開されてしまう
  if (!picking && !over && phase === 'aim' && pieces && pieces.length) {
    d.match = {
      life, turnTeam, ptr, tc: turnCount,
      spikes: spikes.map(sp => [Math.round(sp.x), Math.round(sp.y)]),
      pieces: pieces.map(q => [q.id, q.team, Math.round(q.x), Math.round(q.y), q.cur, q.alive?1:0])
    };
  }
  return d;
}

function applySaved(d){
  if (!d) return;
  if (Array.isArray(d.pick) && d.pick.length === 3 &&
      d.pick.every(id => POOL.some(q => q.id === id))) myPick = d.pick;
  if (Array.isArray(d.unlocked))
    // 保存されていたものに、今の「最初から使える」を足す。引かない。
    // 上書きにすると、コマを増やした時に、前から遊んでいる人にだけ新しいコマが出てこない
    unlocked = [...new Set([...d.unlocked, ...FREE])].filter(id => POOL.some(q => q.id === id));
  // 遊んだ記録は、数値やルールを変えても引き継ぐ。捨てたら集めた意味がなくなる。
  // ただし形が違う古い記録は読まない（2.1.0 で持ち方を作り直したため）
  if (d.mstat && d.mstat.n && typeof d.mstat.n === 'object') {
    mstat = { n:{ ...newMode(), ...d.mstat.n }, h:{ ...newMode(), ...d.mstat.h },
              since: d.mstat.since || 0 };
    if (d.stats && typeof d.stats === 'object') stats = d.stats;
    if (d.comps && typeof d.comps === 'object') comps = d.comps;
  }
  hardOn = !!d.hardOn;
}

function save(){
  try {
    /* ★減る方向の上書きを禁じる。
       `pagehide` で保存しているので、読み込みに失敗した画面や、
       別のタブで開いたままの古い画面が閉じられただけで、
       その空っぽの状態が貯まった記録を消してしまう。
       試合数が今あるものより少ない保存は、書かない */
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const old = JSON.parse(raw);
      const oldN = old && old.mstat && old.mstat.n && typeof old.mstat.n === 'object'
        ? old.mstat.n.n + old.mstat.h.n : 0;
      if (oldN > allN()) return;
    }
    localStorage.setItem(SAVE_KEY, JSON.stringify(serialize()));
  } catch (e) { /* 保存できない設定でも遊べるようにする */ }
}

function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d) return null;
    // 版が違っても、解放・戦績・編成は残す。捨てるのは途中の試合だけ
    if (d.v !== SAVE_VER) delete d.match;
    return d;
  } catch (e) { return null; }
}

function clearSave(){
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

/* 途中の試合を書き戻す。少しでも噛み合わなければ諦めて最初から */
function restoreMatch(m){
  try {
    if (!m || !m.pieces || m.pieces.length !== pieces.length) return false;
    for (const [id, tm, x, y, cur0, alive] of m.pieces) {
      const q = pieces.find(z => z.id === id && z.team === tm);
      if (!q) return false;
      // 体力の上限を変えた後でも壊れないように、今の最大値に収める
      q.x = x; q.y = y; q.cur = Math.min(cur0, q.hp); q.alive = !!alive;
    }
    life = { me: Math.min(m.life.me, BAL.myLife), foe: Math.min(m.life.foe, foeLifeMax()) };
    turnTeam = m.turnTeam; ptr = m.ptr;
    spikes = m.spikes.map(([x,y]) => ({x,y}));
    guide = false;                  // 続きからは案内を出さない
    turnCount = m.tc || 0;
    active = cur(); phase = 'aim'; over = null;
    sync();
    if (turnTeam === 'foe') setTimeout(aiShot, 650);
    return true;
  } catch (e) { return false; }
}

function reset(){
  roster.me  = myPick.map(id => POOL.find(p => p.id === id));
  roster.foe = FOE_TEAM.map(id => POOL.find(p => p.id === id));
  pieces = [];
  roster.me.forEach((p,i) => pieces.push(mk(p,'me',i)));
  roster.foe.forEach((p,i) => pieces.push(mk(p,'foe',i)));
  spikes = []; turnCount = 0;
  life = { me:BAL.myLife, foe:foeLifeMax() };
  turnTeam = 'me'; ptr = { me:0, foe:0 };
  phase = 'aim'; over = null; aim = null; fx = []; hitsThisTurn = 0; flyT = 0;
  active = cur();
  document.getElementById('over').classList.remove('show');
  sync();
}

function mk(p, team, i){
  const n = roster[team].length;
  const hx = AW/2 + (i-(n-1)/2) * 100;
  const hy = team === 'me' ? AH-80 : 80;
  return { ...p, team, i, hx, hy, x:hx, y:hy,
           vx:0, vy:0, cur:p.hp, alive:true, lastHit:0, chg:0 };
}

/* ターンの順番は生死に関係なく固定。倒れているコマは、その番が来た時に戻ってくる */
const cur = () => pieces.find(p => p.team === turnTeam && p.i === ptr[turnTeam]);
const onBoard = t => pieces.filter(p => p.team === t && p.alive);

/* 棘を n 個ふやす。今あるものは消さない */
function addSpikes(n){
  let guard = 0;
  const want = Math.min(BAL.spikeMax, spikes.length + n);
  while (spikes.length < want && guard++ < 400) {
    const s = { x:50 + Math.random()*(AW-100), y:175 + Math.random()*190 };
    if (spikes.some(o => Math.hypot(o.x-s.x, o.y-s.y) < 78)) continue;
    // コマの真下に湧かせない。置いた瞬間に踏んだことになってしまう
    if (pieces.some(q => q.alive && Math.hypot(q.x-s.x, q.y-s.y) < BAL.r + BAL.spikeR + 14)) continue;
    spikes.push(s);
    fx.push({ k:'sset', x:s.x, y:s.y, t:0 });   // 湧いたことが分かるように
  }
}

/* ===== 入力 ===== */
const cv = document.getElementById('cv');
let scale = 1;
const localPt = e => {
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*AW, y:(e.clientY-r.top)/r.height*AH };
};
cv.addEventListener('pointerdown', e => {
  if (phase !== 'aim' || turnTeam !== 'me' || over) return;
  cv.setPointerCapture(e.pointerId);
  const p = localPt(e); aim = { sx:p.x, sy:p.y, cx:p.x, cy:p.y };
});
cv.addEventListener('pointermove', e => { if (aim) { const p = localPt(e); aim.cx = p.x; aim.cy = p.y; } });
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, () => {
  if (!aim) return;
  const dx = aim.sx-aim.cx, dy = aim.sy-aim.cy, d = Math.hypot(dx,dy);
  aim = null;
  if (d < BAL.pullMin) return;
  const k = Math.min(d, BAL.pullMax)/BAL.pullMax;
  launch(dx/d*BAL.power*k, dy/d*BAL.power*k);
}));

function launch(vx, vy){
  active = cur(); if (!active || !active.alive) return;
  active.vx = vx; active.vy = vy;
  hitsThisTurn = 0; dmgThisTurn = 0; comboT = 9; flyT = 0;
  if (turnTeam === 'me') {
    guide = false;                       // 一度弾いたら案内は消す
    st(active.id).t++;
    turnStartD = st(active.id).d;        // 空振りかどうかは、このターンで増えたかで見る
  }
  pieces.forEach(p => p.lastHit = 0);
  phase = 'fly'; sync();
}

/* ===== 物理 ===== */
function physics(dt){
  let sp = 0; pieces.forEach(p => { if (p.alive) sp = Math.max(sp, Math.hypot(p.vx,p.vy)); });
  const steps = Math.min(12, Math.max(1, Math.ceil(sp*dt/7)));
  const h = dt/steps;

  for (let st = 0; st < steps; st++) {
    // 磁力：飛び始めの短い間だけ引かれる。ずっと効くとまとわりついて壊れる
    if (active && active.alive && active.skill === 'magnet' && flyT < BAL.magnetTime
        && Math.hypot(active.vx,active.vy) > BAL.stopAt) {
      const t = nearestFoe(active);
      if (t) {
        const d = Math.hypot(t.x-active.x, t.y-active.y) || 1;
        active.vx += (t.x-active.x)/d * BAL.magnetPull * h;
        active.vy += (t.y-active.y)/d * BAL.magnetPull * h;
      }
    }

    for (const p of pieces) {
      if (!p.alive) continue;
      // 加速：弾いた本人が壁に当たると、減るどころか速くなる
      const isAccel = (p === active && p.skill === 'accel' && flyT < BAL.accelTime);
      const w = isAccel ? BAL.accelWall : BAL.wallBounce;
      let hitWall = false;
      p.x += p.vx*h; p.y += p.vy*h;
      if (p.x < BAL.r)    { p.x = BAL.r;    p.vx = -p.vx*w; hitWall = true; }
      if (p.x > AW-BAL.r) { p.x = AW-BAL.r; p.vx = -p.vx*w; hitWall = true; }
      if (p.y < BAL.r)    { p.y = BAL.r;    p.vy = -p.vy*w; hitWall = true; }
      if (p.y > AH-BAL.r) { p.y = AH-BAL.r; p.vy = -p.vy*w; hitWall = true; }
      if (isAccel && hitWall) {
        const sp2 = Math.hypot(p.vx, p.vy);
        if (sp2 > BAL.accelMax) { p.vx *= BAL.accelMax/sp2; p.vy *= BAL.accelMax/sp2; }
        fx.push({ k:'spark', x:p.x, y:p.y, t:0 });
      }
      p.lastHit = Math.max(0, p.lastHit - h);
    }

    collide();
    if (over) return;

    // 棘。跳ね返らず、踏んだ側が受けて、その棘は消える
    for (const p of pieces) {
      if (!p.alive) continue;
      for (let si = spikes.length-1; si >= 0; si--) {
        const s = spikes[si];
        if (Math.hypot(p.x-s.x, p.y-s.y) < BAL.r + BAL.spikeR) {
          spikes.splice(si,1);
          fx.push({ k:'spikepop', x:s.x, y:s.y, t:0 });
          damage(p, BAL.spikeDmg, 'spike');
        }
      }
    }
    if (over) return;
  }

  flyT += dt;
  const f = Math.pow(BAL.friction, dt);
  const fa = Math.pow(BAL.accelFric, dt);   // 加速中だけ摩擦が弱い
  const fc = Math.pow(BAL.chainFric, dt);   // 連撃も、一度当ててからは転がり続ける
  pieces.forEach(p => {
    const k = (p === active && p.skill === 'accel' && flyT < BAL.accelTime) ? fa
            : (p === active && p.skill === 'chain' && hitsThisTurn > 0 && flyT < BAL.chainTime) ? fc
            : f;
    p.vx *= k; p.vy *= k;
  });

  let moving = false;
  pieces.forEach(p => { if (p.alive && Math.hypot(p.vx,p.vy) >= BAL.stopAt) moving = true; });
  // 何かの拍子に止まらなくなっても、ここで必ず終わらせる
  if (flyT > BAL.maxFlyT) { pieces.forEach(p => { p.vx = p.vy = 0; }); moving = false; }
  if (!moving) endTurn();
}

function collide(){
  const list = pieces.filter(p => p.alive);
  for (let a = 0; a < list.length; a++) for (let b = a+1; b < list.length; b++) {
    const A = list[a], B = list[b];
    const dx = B.x-A.x, dy = B.y-A.y, d = Math.hypot(dx,dy), min = BAL.r*2;
    if (d >= min || d === 0) continue;
    const nx = dx/d, ny = dy/d;
    const vn = (A.vx-B.vx)*nx + (A.vy-B.vy)*ny;

    // 攻撃側チームのコマが相手に当たれば、弾いた本人でなくてもダメージになる。
    // これで「味方を跳ね台にして当てる」が得点になる
    const aAtk = A.team === turnTeam && B.team !== turnTeam;
    const bAtk = B.team === turnTeam && A.team !== turnTeam;
    const atk = aAtk ? A : bAtk ? B : null;
    const def = aAtk ? B : bAtk ? A : null;
    // スキルが乗るのは「今弾いたコマ」だけ
    const skill = (atk && atk === active) ? atk.skill : null;
    const pierce = skill === 'pierce';
    const spBefore = atk ? Math.hypot(atk.vx, atk.vy) : 0;

    if (!pierce) {
      const push = (min-d)/2 + 0.1;
      A.x -= nx*push; A.y -= ny*push; B.x += nx*push; B.y += ny*push;
    }
    if (vn <= 0) continue;

    if (skill === 'heavy') {
      const j = vn * BAL.heavyPush;
      if (atk === A) { B.vx += j*nx; B.vy += j*ny; A.vx *= BAL.heavyKeep; A.vy *= BAL.heavyKeep; }
      else           { A.vx -= j*nx; A.vy -= j*ny; B.vx *= BAL.heavyKeep; B.vy *= BAL.heavyKeep; }
    } else if (pierce) {
      // 跳ね返らずにすり抜ける。ただし抜けるたび自分も遅くなる（強すぎたため）
      const j = vn * 0.5;
      if (atk === A) { B.vx += j*nx; B.vy += j*ny; A.vx *= BAL.pierceSlow; A.vy *= BAL.pierceSlow; }
      else           { A.vx -= j*nx; A.vy -= j*ny; B.vx *= BAL.pierceSlow; B.vy *= BAL.pierceSlow; }
    } else {
      const j = (1+BAL.ballBounce)*vn/2;
      A.vx -= j*nx; A.vy -= j*ny; B.vx += j*nx; B.vy += j*ny;
    }

    /* 加速・連撃：真正面から当たると、同じ重さなので速度をほぼ全部相手に渡し、
       その場で止まってしまう。少し斜めなら止まらないので「止まる時と止まらない時の
       差が激しい」と感じる。勢いの下限を作って、ピタッとは止まらないようにする */
    const keep = skill === 'accel' ? BAL.accelKeep : skill === 'chain' ? BAL.chainKeep : 0;
    if (keep > 0) {
      const want = spBefore * keep, now = Math.hypot(atk.vx, atk.vy);
      if (now < want) {
        if (now > 1) { atk.vx *= want/now; atk.vy *= want/now; }
        else {   // 完全に止まった時は、相手と反対側へ押し戻す
          const sgn = (atk === A) ? -1 : 1;
          atk.vx = nx*want*sgn; atk.vy = ny*want*sgn;
        }
      }
    }

    if (atk && def && def.lastHit <= 0) {
      // 同じ相手に当て直せるまでの間隔。連撃だけ短い＝
      // 壁際に追い込んだ相手を続けて叩ける。連撃が自分で命中を増やせる唯一の形
      def.lastHit = (skill === 'chain') ? BAL.chainRehit : BAL.rehit;
      hitsThisTurn++;
      let dmg = atk.atk;                                        // 当てたコマの攻撃力
      if (skill === 'chain')  dmg += BAL.chainStep * (hitsThisTurn-1);
      if (skill === 'magnet') dmg += BAL.magnetBonus;
      damage(def, dmg, 'hit', atk);
      dmgThisTurn += dmg;
      comboT = 0;                                   // ヒット数の表示を出し直す
      shake = Math.min(9, 2.5 + hitsThisTurn * 0.9);
      if (over) return;
      // 連撃：当てるたび勢いが増して、次の一撃に繋がりやすくなる
      if (skill === 'chain') { atk.vx *= BAL.chainSpeed; atk.vy *= BAL.chainSpeed; }
      // 跳弾：当てた直後、次に近い相手の方へ向き直る
      if (skill === 'ricochet') {
        const nxt = pieces
          .filter(q => q.alive && q.team !== atk.team && q !== def)
          .sort((a2,b2) => Math.hypot(a2.x-atk.x,a2.y-atk.y) - Math.hypot(b2.x-atk.x,b2.y-atk.y))[0];
        if (nxt) {
          const sp2 = Math.hypot(atk.vx, atk.vy) * BAL.ricoKeep;
          const d2 = Math.hypot(nxt.x-atk.x, nxt.y-atk.y) || 1;
          atk.vx = (nxt.x-atk.x)/d2 * sp2;
          atk.vy = (nxt.y-atk.y)/d2 * sp2;
          fx.push({ k:'spark', x:atk.x, y:atk.y, t:0 });
        }
      }
    }
  }
}

function nearestFoe(p){
  let best = null, bd = 1e9;
  for (const q of pieces) {
    if (!q.alive || q.team === p.team) continue;
    const d = Math.hypot(q.x-p.x, q.y-p.y);
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}

function damage(target, amount, kind, src){
  target.cur -= amount;
  if (src && src.team === 'me') st(src.id).d += amount;
  fx.push({ k:'pop', x:target.x, y:target.y, t:0, txt:'-'+amount,
            col: kind==='spike' ? '#ff9d5c' : kind==='extra' ? '#a9e2ff' : '#fff3d0' });
  if (target.cur <= 0) knockOut(target, src);
  sync();
}

/* 落とされたコマは盤面から消え、チームのライフをコストぶん減らす。
   復活は「自分のチームのターンが来た時に、倒れている味方が全員まとめて」 */
function knockOut(p, src){
  if (p.team === 'me') st(p.id).dd++;
  else if (src && src.team === 'me') st(src.id).ko++;
  p.cur = 0; p.alive = false; p.vx = p.vy = 0;
  life[p.team] -= p.cost;
  fx.push({ k:'boom', x:p.x, y:p.y, t:0 });
  fx.push({ k:'pop', x:p.x, y:p.y-24, t:0, txt:'-'+p.cost, col:'#ffd166' });
  if (life[p.team] <= 0) { life[p.team] = 0; finish(p.team === 'foe'); }
}

/* 衝撃波のいまの威力。不発のたびに上がり、当てると 5 に戻る */
const chgMax = () => Math.floor((BAL.blastMax - BAL.blastDmg) / BAL.blastStep);
const blastDmg = p => Math.min(BAL.blastMax, BAL.blastDmg + BAL.blastStep * (p.chg || 0));

/* ===== ターン ===== */
function endTurn(){
  pieces.forEach(p => { p.vx = p.vy = 0; });
  phase = 'aim';
  if (over) return;

  /* 衝撃波：自分のチームの番が終わるたび、盤上にいるフグが全員その場で爆発する。
     弾いたコマかどうかは関係ない。**置いた場所がそのまま効き続ける**技。
     だから弾く時は「当てに行く」のではなく「良い場所へ動かす」ことになる */
  for (const b of pieces.filter(p => p.team === turnTeam && p.alive && p.skill === 'blast')) {
    const caught = pieces.filter(p => p.alive && p.team !== b.team
                                 && Math.hypot(p.x-b.x, p.y-b.y) < BAL.blastR);
    const bd = blastDmg(b);
    fx.push({ k:'wave', x:b.x, y:b.y, t:0, hit:caught.length > 0, n:caught.length, dmg:bd });
    if (!caught.length) { b.chg = Math.min(b.chg + 1, chgMax()); continue; }   // 不発ぶんが溜まる
    b.chg = 0;                                                                 // 当てたら放出
    for (const t of caught) {
      hitsThisTurn++;
      damage(t, bd, 'hit', b);
      dmgThisTurn += bd;
      if (over) return;
    }
    comboT = 0; shake = 9;
  }

  if (turnTeam === 'me' && active && st(active.id).d === turnStartD) st(active.id).z++;

  // このターンの成果をまとめて見せる。「今の、うまくいった」を言葉にしてやる
  if (turnTeam === 'me' && hitsThisTurn > 0) {
    const praise = hitsThisTurn >= 6 ? 'すごい！'
                 : hitsThisTurn >= 4 ? 'うまい！'
                 : hitsThisTurn >= 2 ? 'いいね！' : '';
    fx.push({ k:'sum', t:0, hits:hitsThisTurn, dmg:dmgThisTurn, praise });
  }

  // 追加攻撃：このターン当てた回数だけ弾が飛ぶ。移動はしない
  if (active && active.alive && hitsThisTurn > 0) {
    const t = nearestFoe(active);
    if (t) {
      for (let i = 0; i < Math.min(hitsThisTurn, BAL.extraMax); i++)
        fx.push({ k:'shot', x:active.x, y:active.y, tx:t.x, ty:t.y,
                  t:-i*0.1, col:active.shotCol, target:t, src:active });
      return;
    }
  }
  nextTurn();
}

function nextTurn(){
  if (over) return;
  turnTeam = turnTeam === 'me' ? 'foe' : 'me';
  ptr[turnTeam] = (ptr[turnTeam] + 1) % roster[turnTeam].length;
  /* 倒れたコマは、次のターンが始まる時に必ず戻る。両チームとも。
     以前は「自分のチームの番が来た時」だったので、自分の番で倒れると
     相手の番のあいだ盤上から消えていた。友人はそれを不具合だと思った——
     たしかに1ターン丸ごと消えるのは長い。
     ★「相手の番で戻る」だけにしてはいけない。相手の番に倒されたコマが
       自分の番に戻らず、動かせないコマで手番が来て詰む */
  pieces.filter(p => !p.alive).forEach(revive);
  active = cur();
  hitsThisTurn = 0;
  // 3ターンごとに棘がふえる。最初のひと湧きは3ターン目なので、案内とは重ならない
  turnCount++;
  if (turnCount % BAL.spikeEvery === 0)
    addSpikes(BAL.spikeAddMin + Math.floor(Math.random() * (BAL.spikeAddMax - BAL.spikeAddMin + 1)));
  sync();
  save();                                   // 操作待ちになった時点を残す
  if (turnTeam === 'foe') setTimeout(aiShot, 650);
}

function revive(p){
  p.alive = true; p.cur = p.hp; p.vx = p.vy = 0;
  // 自陣の定位置へ。埋まっていたら少しずらす
  p.x = p.hx; p.y = p.hy;
  for (let n = 0; n < 24; n++) {
    const hit = pieces.find(q => q !== p && q.alive && Math.hypot(q.x-p.x, q.y-p.y) < BAL.r*2);
    if (!hit) break;
    p.x = BAL.r + Math.random()*(AW-BAL.r*2);
    p.y = p.team === 'me' ? AH-BAL.r-Math.random()*90 : BAL.r+Math.random()*90;
  }
  fx.push({ k:'revive', x:p.x, y:p.y, t:0 });
}

function aiShot(){
  if (over || turnTeam !== 'foe' || phase !== 'aim') return;
  const p = cur();
  if (!p || !p.alive) { nextTurn(); return; }        // 念のため。ここで止まると進行が死ぬ
  const t = nearestFoe(p);
  // 相手が全員ダウンしていて狙う先が無くても、必ず弾く。
  // ここで return するとターンが進まなくなり、ゲームが停止する
  const base = t ? Math.atan2(t.y-p.y, t.x-p.x)
                 : (p.team === 'foe' ? Math.PI/2 : -Math.PI/2) + (Math.random()-0.5);
  // 盤面が混んでいるので、少しの角度ブレでは外れてくれない。
  // 難易度は「たまに大きく外す」で作る
  const a = Math.random() < BAL.aiMiss
    ? Math.random() * Math.PI * 2
    : base + (Math.random()-0.5) * BAL.aiNoise * Math.PI/180 * 2;
  const pw = 0.72 + Math.random()*0.28;
  launch(Math.cos(a)*BAL.power*pw, Math.sin(a)*BAL.power*pw);
}

function finish(won){
  if (over) return;
  over = won ? 'win' : 'lose';
  phase = 'aim';
  document.getElementById('ovTitle').textContent = won ? 'かち！' : 'まけ…';
  document.getElementById('ovTitle').style.color = won ? 'var(--gold)' : 'var(--foe)';
  document.getElementById('ovText').innerHTML =
    'のこりライフ　じぶん <span class="num">' + life.me + '</span>　／　あいて <span class="num">' + life.foe + '</span>';
  document.getElementById('over').classList.add('show');
  if (!mstat.since) mstat.since = Date.now();   // 消えたことが目で分かるように
  const M = hardOn ? mstat.h : mstat.n;
  M.n++; M.tn += turnCount;
  if (won) { M.w++; M.mw += life.me; } else { M.ml += life.foe; }
  // 使用率は「編成に入れた回数 ÷ 全試合数」。強さと人気は別ものなので、別に数える
  for (const q of roster.me) st(q.id).p++;
  // 編成ごとの成績。圧勝しやすい組み合わせを見るため。実際に使う編成は数種類なので数が貯まる
  const c = cmp(cmpKey());
  c.n++; if (won) { c.w++; c.mw += life.me; }
  sync();
  save();
}

/* ===== 描画 ===== */
const ctx = cv.getContext('2d');
function fitCanvas(){
  const box = document.getElementById('stage').getBoundingClientRect();
  if (!box.width || !box.height) return;   // 画面が隠れている間は測れない
  const s = Math.min(box.width/AW, box.height/AH);
  cv.style.width = (AW*s)+'px'; cv.style.height = (AH*s)+'px';
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = Math.round(AW*s*dpr); cv.height = Math.round(AH*s*dpr);
  scale = s*dpr;
}
addEventListener('resize', fitCanvas);

function draw(){
  // 当てた時に画面を揺らす。ヒットが重なるほど大きく
  const ox = shake ? (Math.random()-0.5)*shake : 0;
  const oy = shake ? (Math.random()-0.5)*shake : 0;
  ctx.setTransform(scale,0,0,scale, ox*scale, oy*scale);
  ctx.fillStyle = '#141110'; ctx.fillRect(-12,-12,AW+24,AH+24);
  ctx.strokeStyle = '#211c19'; ctx.lineWidth = 1;
  for (let x=60;x<AW;x+=60){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,AH); ctx.stroke(); }
  for (let y=60;y<AH;y+=60){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(AW,y); ctx.stroke(); }

  for (const s of spikes) {
    ctx.fillStyle = '#241a14';
    ctx.beginPath(); ctx.arc(s.x, s.y, BAL.spikeR*1.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#8a5a34';
    ctx.beginPath();
    for (let i=0;i<12;i++){
      const a = i/12*Math.PI*2, r = i%2 ? BAL.spikeR*0.42 : BAL.spikeR*1.15;
      const px = s.x+Math.cos(a)*r, py = s.y+Math.sin(a)*r;
      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  // 磁力が効いている間、引かれている相手へ線を引く。
  // 「曲がっている」ことが見えないと、効果が無いのと同じになる
  if (active && active.alive && active.skill === 'magnet' &&
      phase === 'fly' && flyT < BAL.magnetTime) {
    const t = nearestFoe(active);
    if (t) {
      ctx.save(); ctx.setLineDash([4,6]);
      ctx.strokeStyle = 'rgba(143,215,255,.75)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(active.x, active.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      ctx.restore();
    }
  }

  // 衝撃波：盤上にいるフグ全員ぶんの範囲を、常に出しておく。
  // 毎ターン効くのだから、自分の番でなくても見えていないと置き場所を考えられない
  if (!over && !picking) {
    ctx.save(); ctx.setLineDash([5,7]); ctx.lineWidth = 1.5;
    for (const p of pieces) {
      if (!p.alive || p.skill !== 'blast') continue;
      const chg = (p.chg || 0) > 0;
      ctx.strokeStyle = chg ? 'rgba(255,155,138,' + (0.45 + p.chg*0.15) + ')'
                            : (p === active) ? 'rgba(247,183,51,.55)' : 'rgba(247,183,51,.24)';
      ctx.lineWidth = chg ? 1.5 + p.chg*0.6 : 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, BAL.blastR, 0, 7); ctx.stroke();
      // 溜まっている威力を数字で出す。見えない強さは無いのと同じ
      ctx.setLineDash([]);
      ctx.fillStyle = chg ? '#ff9b8a' : 'rgba(247,183,51,.7)';
      ctx.font = 'bold 12px "Bungee", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(blastDmg(p), p.x, p.y - BAL.blastR + 9);
      ctx.setLineDash([5,7]);
    }
    ctx.restore();
  }

  for (const p of pieces) if (p.alive) drawPiece(p);
  drawAim();

  // 当てるたびヒット数を大きく出す。数が増えるほど大きく、色も派手に
  if (comboT < 0.9 && hitsThisTurn > 0) {
    const k = comboT/0.9;
    const size = 30 + Math.min(hitsThisTurn,8)*6 + (1-k)*10;
    ctx.globalAlpha = 1 - k*k;
    ctx.fillStyle = hitsThisTurn >= 4 ? '#f7b733' : '#fff3d0';
    ctx.font = 'bold ' + size + 'px "Bungee", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(hitsThisTurn + ' HIT', AW/2, 74);
    ctx.globalAlpha = 1;
  }

  // ターンの締め。「今の、うまくいった」を見せる
  const sum = fx.find(f => f.k === 'sum');
  if (sum && sum.t >= 0) {
    const k = Math.min(1, sum.t/1.3);
    ctx.globalAlpha = k < 0.75 ? 1 : (1-k)*4;
    if (sum.praise) {
      ctx.fillStyle = '#f7b733';
      ctx.font = 'bold 30px "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(sum.praise, AW/2, AH/2 - 18);
    }
    ctx.fillStyle = '#f0e7dd';
    ctx.font = 'bold 21px "Bungee", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(sum.hits + ' HIT   ' + sum.dmg + ' DMG', AW/2, AH/2 + 20);
    ctx.globalAlpha = 1;
  }

  // 最初の一投までは、勝ち方を出しておく
  if (guide && !picking && !over) {
    ctx.fillStyle = 'rgba(15,13,11,.8)';
    ctx.fillRect(10, AH/2-34, AW-20, 68);
    ctx.strokeStyle = 'rgba(247,183,51,.5)'; ctx.lineWidth = 1;
    ctx.strokeRect(10, AH/2-34, AW-20, 68);
    ctx.fillStyle = '#f7b733'; ctx.font = 'bold 17px "Noto Sans JP", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('あいての ライフを 0 に したら かち', AW/2, AH/2-10);
    ctx.fillStyle = '#9b8b7c'; ctx.font = '13px "Noto Sans JP", sans-serif';
    ctx.fillText('コマを ひっぱって はなす', AW/2, AH/2+14);
  }

  for (const f of fx) {
    if (f.t < 0) continue;
    if (f.k === 'pop') {
      const k = f.t/0.6; ctx.globalAlpha = 1-k;
      ctx.fillStyle = f.col; ctx.font = 'bold 19px "Bungee", sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x, f.y-30-k*22);
    } else if (f.k === 'sset') {
      const k = f.t/0.45; ctx.globalAlpha = k;
      ctx.strokeStyle = '#c9884f'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, BAL.spikeR*(2.6-k*1.4), 0, 7); ctx.stroke();
    } else if (f.k === 'spikepop') {
      const k = f.t/0.45; ctx.globalAlpha = 1-k;
      ctx.strokeStyle = '#c9884f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, BAL.spikeR*(1+k*1.6), 0, 7); ctx.stroke();
    } else if (f.k === 'shot') {
      const k = Math.min(1, f.t/0.28);
      const x = f.x+(f.tx-f.x)*k, y = f.y+(f.ty-f.y)*k;
      ctx.fillStyle = f.col;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
      ctx.globalAlpha = .35;
      ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fill();
    } else if (f.k === 'spark') {
      const k = f.t/0.3; ctx.globalAlpha = 1-k;
      ctx.strokeStyle = '#fff3d0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, 8+k*22, 0, 7); ctx.stroke();
    } else if (f.k === 'wave') {
      // 不発の時も必ず出す。「今のは何も起きなかった」が伝わらないと、壊れて見える
      const k = f.t/0.55;
      ctx.globalAlpha = (1-k) * (f.hit ? 1 : 0.4);
      ctx.fillStyle = f.hit ? 'rgba(247,183,51,.18)' : 'rgba(155,139,124,.14)';
      ctx.beginPath(); ctx.arc(f.x, f.y, BAL.blastR*k, 0, 7); ctx.fill();
      ctx.strokeStyle = f.hit ? '#f7b733' : '#6b5f53';
      ctx.lineWidth = f.hit ? 6*(1-k)+2 : 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, BAL.blastR*k, 0, 7); ctx.stroke();
      if (!f.hit && k < 0.5) {
        ctx.globalAlpha = 1-k*2;
        ctx.fillStyle = '#6b5f53'; ctx.font = 'bold 15px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('ふはつ', f.x, f.y - BAL.r - 16);
      }
    } else if (f.k === 'revive') {
      const k = f.t/0.45; ctx.globalAlpha = 1-k;
      ctx.strokeStyle = '#9fe8b0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, BAL.r*(1.9-k*0.8), 0, 7); ctx.stroke();
    } else {
      const k = f.t/0.45; ctx.globalAlpha = 1-k;
      ctx.strokeStyle = '#f7b733'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, 20+k*46, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function drawPiece(p){
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y+BAL.r*0.75, BAL.r*0.85, BAL.r*0.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = p.team === 'me' ? '#6ec4e0' : '#e0725d';
  ctx.beginPath(); ctx.arc(p.x, p.y, BAL.r, 0, 7); ctx.fill();
  if (p === active && !over) { ctx.strokeStyle = '#f7b733'; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.face, p.x, p.y+1);
  // 残り体力を外周の弧で示す
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(p.x, p.y, BAL.r+4, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = p.team === 'me' ? '#6ec4e0' : '#e0725d';
  ctx.beginPath(); ctx.arc(p.x, p.y, BAL.r+4, -Math.PI/2, -Math.PI/2+Math.PI*2*(p.cur/p.hp)); ctx.stroke();
  // 体力の数字
  ctx.fillStyle = '#0f0d0b';
  ctx.beginPath(); ctx.arc(p.x+BAL.r*0.72, p.y+BAL.r*0.72, 11.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#f0e7dd'; ctx.font = 'bold 10px "Bungee", sans-serif';
  ctx.fillText(p.cur, p.x+BAL.r*0.72, p.y+BAL.r*0.72+1);
}

function drawAim(){
  if (!aim || turnTeam !== 'me' || !active) return;
  const dx = aim.sx-aim.cx, dy = aim.sy-aim.cy, d = Math.hypot(dx,dy);
  if (d < BAL.pullMin) return;
  const k = Math.min(d, BAL.pullMax)/BAL.pullMax, ux = dx/d, uy = dy/d;
  ctx.save(); ctx.setLineDash([7,7]);
  ctx.strokeStyle = 'rgba(247,183,51,'+(0.35+k*0.5)+')'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(active.x+ux*(BAL.r+8), active.y+uy*(BAL.r+8));
  ctx.lineTo(active.x+ux*(BAL.r+18+k*70), active.y+uy*(BAL.r+18+k*70));
  ctx.stroke(); ctx.restore();
}

/* ===== UI ===== */
function sync(){
  for (const t of ['me','foe']) {
    const max = t === 'me' ? BAL.myLife : foeLifeMax();
    document.getElementById(t === 'me' ? 'myPips' : 'foePips').innerHTML =
      Array.from({length:max}, (_,i) =>
        '<span class="pip' + (i < life[t] ? ' on' : '') + '"></span>').join('');
    document.getElementById(t === 'me' ? 'myN' : 'foeN').textContent = life[t];

    document.getElementById(t === 'me' ? 'myTeam' : 'foeTeam').innerHTML =
      pieces.filter(p => p.team === t).map(p =>
        '<div class="chip' + (p === active && !over ? ' now' : '') + (p.alive ? '' : ' down') + '">' +
          '<div class="f">' + p.face + '</div>' +
          '<div class="s">' + (p.alive ? '<b>' + p.cur + '</b>/' + p.hp : 'ダウン') +
            '　力' + p.atk + '</div>' +
        '</div>').join('');
  }
  const a = active;
  document.getElementById('who').textContent = over
    ? (over === 'win' ? 'かった！' : 'まけた…')
    : (turnTeam === 'me' ? 'あなたのばん　' : 'あいてのばん　') + (a ? a.face + ' ' + a.name : '')
      + (onBoard(turnTeam === 'me' ? 'foe' : 'me').length === 0 ? '　（あいてはぜんいんダウン）' : '');
  document.getElementById('sk').innerHTML = over
    ? '「もう一度」でやり直せます'
    : (a ? '<b>' + SKILLS[a.skill].name + '</b>　' + SKILLS[a.skill].desc : '');
}

/* ===== 画面の切り替え =====
   編成は「たいせん」の中に重ねたまま。試合と編成は同じ画面という決まり。
   いつか「せいちょう」を作る時は、たいせんの右隣に足す */
const SCREENS = [
  { id:'scrPlay', name:'たいせん' },
  { id:'scrData', name:'きろく'   },
  { id:'scrSet',  name:'せってい' }
];
let scr = 0;

function goScreen(n){
  scr = (n + SCREENS.length) % SCREENS.length;
  SCREENS.forEach((s2, k) => document.getElementById(s2.id).classList.toggle('on', k === scr));
  document.getElementById('navName').textContent = SCREENS[scr].name;
  document.getElementById('navDots').innerHTML =
    SCREENS.map((_, k) => '<span class="' + (k === scr ? 'on' : '') + '"></span>').join('');
  // 隠れている間は盤面の大きさが測れないので、戻った時に測り直す
  if (SCREENS[scr].id === 'scrPlay') fitCanvas();
  if (SCREENS[scr].id === 'scrData') renderData();
  if (SCREENS[scr].id === 'scrSet')  renderSet();
}
const ioText = document.getElementById('ioText');
const ioCode = document.getElementById('ioCode');
const ioMsg  = document.getElementById('ioMsg');
const ioAdd  = document.getElementById('ioAdd');

document.getElementById('ioOut').addEventListener('click', () => {
  // 入力欄には入れない。触れると画面が拡大して戻せなくなる
  ioText.classList.remove('show'); ioAdd.classList.remove('show');
  const code = exportCode();
  ioCode.textContent = code;
  ioCode.classList.add('show');
  ioMsg.textContent = '長おしで えらんで コピーできます';
  try {
    navigator.clipboard.writeText(code)
      .then(() => { ioMsg.textContent = 'コピーしました'; })
      .catch(() => {});
  } catch (e) { /* コピーできない環境でも、文字は出ているので手で選べる */ }
});

document.getElementById('ioIn').addEventListener('click', () => {
  ioCode.classList.remove('show');
  ioText.classList.add('show'); ioAdd.classList.add('show');
  ioText.value = '';           // ここで focus しない。拡大のきっかけになる
  ioMsg.textContent = 'かきだした 文字を はりつけて、下を おす';
});

ioAdd.addEventListener('click', () => {
  const g = parseCode(ioText.value);
  if (!g) { ioMsg.textContent = '読めませんでした。かきだした 文字を そのまま はってください'; return; }
  mergeCode(g);
  save(); renderData();
  ioText.value = ''; ioText.classList.remove('show'); ioAdd.classList.remove('show');
  ioCode.classList.remove('show');
  ioMsg.textContent = (g.m.n.n + g.m.h.n) + ' しあい ぶんを たしました';
});

document.getElementById('navPrev').addEventListener('click', () => goScreen(scr - 1));
document.getElementById('navNext').addEventListener('click', () => goScreen(scr + 1));

/* ===== せってい ===== */

document.getElementById('hardSw').addEventListener('click', () => {

});
document.getElementById('guideBtn').addEventListener('click', () => {

});
document.getElementById('wipeBtn').addEventListener('click', () => {

/* ===== ループ ===== */
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  // 盤面を見ていない間は進めない。見ていないところで勝負が動くのは気持ちが悪い
  const playing = SCREENS[scr].id === 'scrPlay';
  if (playing && phase === 'fly' && !over) physics(dt);

  comboT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt*26);
  const hadShots = fx.some(f => f.k === 'shot');
  for (const f of fx) {
    f.t += dt;
    if (f.k === 'shot' && !f.done && f.t >= 0.28) {
      f.done = true;
      if (f.target.alive) damage(f.target, BAL.extraDmg, 'extra', f.src);
    }
  }
  fx = fx.filter(f => f.t < (f.k === 'pop' ? 0.6 : f.k === 'shot' ? 0.42 : f.k === 'spark' ? 0.3 : f.k === 'sum' ? 1.3 : f.k === 'wave' ? 0.55 : 0.45));
  if (hadShots && !fx.some(f => f.k === 'shot') && phase === 'aim' && !over) nextTurn();

  if (playing) draw();
  requestAnimationFrame(loop);
}

/* ===== 編成画面 ===== */
const pickEl = document.getElementById('pick');

/* 編成中の上下のチップ。盤面はまだ無いので、選択そのものから描く */

           '<div class="s"><b>' + p.hp + '</b>/' + p.hp + '　力' + p.atk + '</div></div>';

  document.getElementById('foeTeam').innerHTML = FOE_TEAM.map(id => {
    const p = POOL.find(x => x.id === id);
    return '<div class="chip"><div class="f">' + p.face + '</div>' +
           '<div class="s"><b>' + p.hp + '</b>/' + p.hp + '　力' + p.atk + '</div></div>';

function renderPick(){

/* 編成中は、下の欄を「今押したコマの説明」にする。

/* 記録の画面。ボットの数字は当てにならないので、人が遊んだ数字をここに出す */
function renderData(){
  const M = mstat, tot = allN();
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '-';

  /* ① 難易度。ここだけはモード別に見る。相手のライフが違うので混ぜられない */
  const line = (nm, m) => !m.n ? '' :
    '<tr><td class="nm">' + nm + '</td><td>' + m.n + '</td>' +
    '<td class="big">' + pct(m.w, m.n) + '</td>' +
    '<td>' + (m.tn / m.n).toFixed(0) + '</td>' +
    '<td>' + (m.w ? (m.mw / m.w).toFixed(1) : '-') + '</td>' +
    '<td>' + (m.n - m.w ? (m.ml / (m.n - m.w)).toFixed(1) : '-') + '</td></tr>';
  const modeRows = line('ふつう', M.n) + line('むずかしい', M.h);

  /* ② コマ。ここはモードをまとめる。1回のダメージも使用率もモードで変わらないため */
  const pieceRows = POOL.map(p => {
    const v = stats[p.id];
    if (!v || !v.t) return '<tr class="none"><td class="nm">' + p.face + p.name +
      '</td><td>0</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>';
    return '<tr><td class="nm">' + p.face + p.name + '</td>' +
      '<td>' + v.t + '</td>' +
      '<td class="big">' + (v.d / v.t).toFixed(1) + '</td>' +
      '<td>' + pct(v.p, tot) + '</td>' +
      '<td>' + pct(v.z, v.t) + '</td>' +
      '<td>' + v.ko + ' / ' + v.dd + '</td></tr>';
  }).join('');

  /* ③ 編成。圧勝しやすい組み合わせを探す。使った編成だけ、多い順に */
  const face = id => (POOL.find(q => q.id === id) || {}).face || '?';
  const compRows = Object.entries(comps)
    .sort((a, b) => b[1].n - a[1].n).slice(0, 8)
    .map(([k, c]) => {
      const [md, ids] = k.split('|');
      return '<tr><td class="nm">' + ids.split('+').map(face).join('') +
        (md === 'h' ? ' <span style="color:var(--foe)">むず</span>' : '') + '</td>' +
        '<td>' + c.n + '</td><td class="big">' + pct(c.w, c.n) + '</td>' +
        '<td>' + (c.w ? (c.mw / c.w).toFixed(1) : '-') + '</td></tr>';
    }).join('');

  document.getElementById('dataHead').innerHTML = tot
    ? '<b>' + tot + '</b> しあい' : 'まだ 1しあいも していません';

  document.getElementById('dataTable').innerHTML =
    (modeRows ? '<div class="dcap">むずかしさ</div><table class="dt">' +
      '<tr><th>モード</th><th>しあい</th><th>しょうりつ</th><th>ターン</th>' +
      '<th>かった時の<br>のこり</th><th>まけた時の<br>あいての のこり</th></tr>' +
      modeRows + '</table>' : '') +
    '<div class="dcap">コマ（ふつうと むずかしいを あわせて）</div><table class="dt">' +
      '<tr><th>コマ</th><th>はじいた<br>かいすう</th><th>1かいの<br>ダメージ</th>' +
      '<th>つかった<br>わりあい</th><th>から<br>ぶり</th><th>たおした<br>／やられた</th></tr>' +
      pieceRows + '</table>' +
    (compRows ? '<div class="dcap">へんせい</div><table class="dt">' +
      '<tr><th>3たい</th><th>しあい</th><th>しょうりつ</th><th>かった時の<br>のこり</th></tr>' +
      compRows + '</table>' : '');

  const el = document.getElementById('saveState');
  if (!saveOK) {
    el.className = 'warn';
    el.innerHTML = '<b>このブラウザでは 保存できません</b><br>' +
      'とじる前に「かきだす」で 文字にして のこしてください';
  } else {
    const d = mstat.since ? new Date(mstat.since) : null;
    const from = d ? (d.getMonth()+1) + '月' + d.getDate() + '日 から ためています<br>' : '';
    el.className = inFrame ? 'warn' : '';
    el.innerHTML = from + (inFrame
      ? '<b>ブラウザを とじると 消えることが あります</b><br>' +
        '大事な きろくは「かきだす」で のこしてください'
      : 'この ページでは きちんと 保存されます');
  }

  // 数が少ないうちに読むと、まず間違える。何回で足りるかを先に言っておく
  const need = POOL.filter(p => (stats[p.id] || {t:0}).t < 30).length;
  document.getElementById('dataNote').textContent = need
    ? 'はじいた かいすうが 30 を こえた コマから 読めるように なります（あと ' + need + ' たい）'
    : 'どのコマも 30かい を こえました。くらべて 大丈夫です';
}


/* ===== きろくの もちだし =====
   このページは別サイトの枠の中でも動くので、ブラウザによっては
   閉じた時に保存が消える。消えても困らないよう、文字にして持ち出せるようにする。
   人が読める形にしてあるので、写真に撮っても中身が分かる */
const IO_HEAD = 'HAJIKI2';   // 形を変えたら必ず上げる。古い形を黙って読むと数字が混ざる

function exportCode(){
  const O = [IO_HEAD];
  const md = (tag, m) => { if (m.n) O.push('M ' + tag + ' ' + m.n + ' ' + m.w + ' ' + m.tn + ' ' + m.mw + ' ' + m.ml); };
  md('n', mstat.n); md('h', mstat.h);
  for (const p of POOL) {
    const v = stats[p.id];
    if (v && (v.t || v.p)) O.push('P ' + p.id + ' ' + v.t + ' ' + v.d + ' ' + v.z + ' ' + v.ko + ' ' + v.dd + ' ' + v.p);
  }
  for (const k in comps) {
    const c = comps[k], [tag, ids] = k.split('|');
    if (c.n) O.push('C ' + tag + ' ' + ids + ' ' + c.n + ' ' + c.w + ' ' + c.mw);
  }
  return O.join('\n');
}

/* 読めなければ null。壊れた文字列で今の記録を壊さない */
function parseCode(txt){
  const lines = String(txt).trim().split(/[\r\n]+/).map(x => x.trim()).filter(Boolean);
  if (!lines.length || lines[0] !== IO_HEAD) return null;
  const num = x => { const n = Number(x); return Number.isFinite(n) && n >= 0 ? n : null; };
  const nums = (a, k) => { const v = a.map(num); return v.length === k && !v.some(x => x === null) ? v : null; };
  const out = { m:{ n:newMode(), h:newMode() }, s:{}, c:{} };
  const ids = POOL.map(p => p.id);
  for (const line of lines.slice(1)) {
    const c = line.split(/\s+/);
    if (c[0] === 'M' && (c[1] === 'n' || c[1] === 'h')) {
      const v = nums(c.slice(2, 7), 5); if (!v) return null;
      out.m[c[1]] = { n:v[0], w:v[1], tn:v[2], mw:v[3], ml:v[4] };
    } else if (c[0] === 'P' && ids.includes(c[1])) {
      const v = nums(c.slice(2, 8), 6); if (!v) return null;
      out.s[c[1]] = { t:v[0], d:v[1], z:v[2], ko:v[3], dd:v[4], p:v[5] };
    } else if (c[0] === 'C' && (c[1] === 'n' || c[1] === 'h')) {
      const parts = String(c[2] || '').split('+');
      if (parts.length !== 3 || parts.some(x => !ids.includes(x))) return null;
      const v = nums(c.slice(3, 6), 3); if (!v) return null;
      out.c[c[1] + '|' + parts.slice().sort().join('+')] = { n:v[0], w:v[1], mw:v[2] };
    } else return null;
  }
  return (out.m.n.n + out.m.h.n) ? out : null;
}

/* 足す。上書きではない——2人ぶんを合わせるための機能だから */
function mergeCode(g){
  for (const tag of ['n', 'h']) {
    const a = mstat[tag], b = g.m[tag];
    a.n += b.n; a.w += b.w; a.tn += b.tn; a.mw += b.mw; a.ml += b.ml;
  }
  if (!mstat.since) mstat.since = Date.now();
  for (const id in g.s) {
    const a = st(id), b = g.s[id];
    a.t += b.t; a.d += b.d; a.z += b.z; a.ko += b.ko; a.dd += b.dd; a.p += b.p;
  }
  for (const k in g.c) {
    const a = cmp(k), b = g.c[k];
    a.n += b.n; a.w += b.w; a.mw += b.mw;
  }
}


function openPick(){
  picking = true;
  goScreen(0);        // 編成は たいせん の上に出す
  pickEl.classList.add('show');
  document.getElementById('over').classList.remove('show');
  renderPick();
  setPickInfo(null);
}

document.getElementById('pickList').addEventListener('click', e => {
  const c = e.target.closest('[data-id]'); if (!c) return;
  const id = c.dataset.id;
  if (myPick.includes(id)) myPick = myPick.filter(x => x !== id);
  else if (myPick.length < 3) myPick.push(id);
  else { myPick.shift(); myPick.push(id); }   // 3体埋まっていたら古い方を外す
  renderPick();
  setPickInfo(POOL.find(p => p.id === id));   // 押したコマの説明を下に出す
  save();
});

document.getElementById('start').addEventListener('click', () => {
  if (myPick.length !== 3) return;
  picking = false; guide = true;
  pickEl.classList.remove('show');
  reset(); fitCanvas(); save();
});
document.getElementById('reteam').addEventListener('click', openPick);

document.getElementById('retry').addEventListener('click', () => { reset(); save(); });
/* 拡大は画面ぜんぶで止める。
   一度「盤面の上だけ」にしたが、外を触ると拡大でき、
   ホーム画面のアプリではアドレスバーも無いので戻せなくなった。
   閉じ込めの元だった「入力欄の自動拡大」は消してあるので
   （書き出しは入力欄ではない／読み込み欄は16px）、全部止めても閉じ込められない。
   ★読み込み欄の文字を16px未満にしないこと。したら閉じ込めが復活する */
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
// 指2本の操作でも拡大する端末があるので、そちらも止める
document.addEventListener('touchmove', e => {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive:false });
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
if (!document.querySelector('meta[name="viewport"]')) {
  document.head.insertAdjacentHTML('beforeend',
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">');
}

const saved = load();
applySaved(saved);
goScreen(0);
reset(); fitCanvas();
// 途中の試合が残っていれば続きから。無ければ編成画面から
if (!(saved && saved.match && restoreMatch(saved.match))) openPick();
requestAnimationFrame(loop);
</script>
